<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Squid Game UI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">

    <nav>
      <div class="logo">SQUID GAME</div>

      <ul class="menu">
        <li>About</li>
        <li class="active">Watch now</li>
        <li>Actors</li>
        <li>Contact</li>
      </ul>

      <div class="hamburger">☰</div>
    </nav>

    <div class="hero">

      <div class="left">

        <h1 class="title">
          SQUID<br>
          GAME
        </h1>

        <p class="desc">
          Action / Thriller / Drama series directed by Dong-hyuk Hwang.
          Season 1 includes 9 exciting episodes with intense survival challenges.
        </p>

        <div class="buttons">
          <button class="btn btn-primary">▶ Play Now</button>
          <button class="btn btn-secondary">▷ Watch Trailer</button>
        </div>

      </div>

      <div class="right">

        <img class="guard"
          src="https://images.unsplash.com/photo-1633613286991-611fe299c4be?q=80&w=1200&auto=format&fit=crop"
          alt="">

      </div>

    </div>

    <div class="vertical">SQUID</div>

    <div class="social">
      <i>𝕏</i>
      <i>◎</i>
      <i>f</i>
    </div>

    <div class="bg-text">GAME</div>

    <div class="cards">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1633613286991-611fe299c4be?q=80&w=1200&auto=format&fit=crop">
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1635805737707-575885ab0820?q=80&w=1200&auto=format&fit=crop">
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1635805737707-575885ab0820?q=80&w=1200&auto=format&fit=crop">
      </div>

    </div>

  </div>

</body>
</html>
